<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>超整さん</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <h1>超整さん</h1>

    <h2>10/31(土)の食事会に参加されますか？</h2>

    <div style="margin-top: 20px;">
      <p>名前</p>
      <input type="text" id="user-name" placeholder="名前を入力してください" />
    </div>

    <div class="attendance-buttons" role="group" aria-label="参加回答">
      <button class="attendance-button join-button" id="join-button" type="button">参加</button>
      <button class="attendance-button absent-button" id="absent-button" type="button">不参加</button>
      <button class="attendance-button confirm-button" id="confirm-button" type="button">提出</button>
    </div>

    <div id="member-status" style="margin-top: 20px;">

    <h2>参加状況一覧</h2>

    <table border="1" style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr>
          <th>名前</th>
          <th>参加状況</th>
        </tr>
      </thead>
      <tbody id="attendance-table-body"></tbody>
    </table>
  </body>
</html>
